name: AAC
options:
  bundleIdPrefix: com.jbaker
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0

settings:
  base:
    DEVELOPMENT_TEAM: G3P9A8Z2NP
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_XR_DESIGNED_FOR: "NO"
    INFOPLIST_FILE: AAC/Info.plist

targets:
  AAC:
    type: application
    platform: iOS
    sources:
      - AAC
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jbaker.AAC
        INFOPLIST_FILE: AAC/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G3P9A8Z2NP
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Generate Secrets
        script: |
          bash "${SRCROOT}/scripts/generate_secrets.sh"
        inputFiles:
          - $(SRCROOT)/scripts/generate_secrets.sh
          - $(SRCROOT)/Secrets.plist
        outputFiles:
          - $(SRCROOT)/AAC/Services/GeneratedSecrets.swift
        basedOnDependencyAnalysis: false
