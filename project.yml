name: My Words
options:
  bundleIdPrefix: com.jbaker
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "2630"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"

settings:
  base:
    DEVELOPMENT_TEAM: G3P9A8Z2NP
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_XR_DESIGNED_FOR: "NO"
    INFOPLIST_FILE: My Words/Info.plist
    DEAD_CODE_STRIPPING: "YES"

targets:
  My Words:
    type: application
    platform: iOS
    sources:
      - My Words
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jbaker.AAC
        INFOPLIST_FILE: My Words/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G3P9A8Z2NP
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    preBuildScripts:
      - name: Generate Secrets
        script: |
          bash "${SRCROOT}/scripts/generate_secrets.sh"
        inputFiles:
          - $(SRCROOT)/scripts/generate_secrets.sh
          - $(SRCROOT)/Secrets.plist
        outputFiles:
          - $(SRCROOT)/My Words/Services/GeneratedSecrets.swift
        basedOnDependencyAnalysis: false
